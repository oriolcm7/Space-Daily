name: Update Daily Space News

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS feeds and archive edition
        run: python scripts/update_news.py
      - name: Commit edition if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editions/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily space news edition"
            git push
          else
            echo "No edition changes to commit."
          fi
